<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="navbar">
    <h2>Resume Builder</h2>
    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <input id="name" placeholder="Name" onkeyup="update()">
        <input id="email" placeholder="Email" onkeyup="update()">

        <input type="file" id="photoInput" onchange="loadImage(event)">

        <textarea id="education" placeholder="Education" onkeyup="update()"></textarea>
        <textarea id="projects" placeholder="Projects" onkeyup="update()"></textarea>

        <input id="skillInput" placeholder="Skill">
        <button onclick="addSkill()">Add Skill</button>

        <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <!-- RESUME -->
    <div id="resume" class="resume">
        <div class="sidebar">
            <img id="rphoto" src="" alt="Photo">
            <h2 id="rname">Your Name</h2>
            <p id="remail"></p>
        </div>

        <div class="main">
            <h3>Education</h3>
            <p id="reducation"></p>

            <h3>Projects</h3>
            <p id="rprojects"></p>

            <h3>Skills</h3>
            <div id="rskills"></div>
        </div>
    </div>

</div>

<script src="script.js"></script>

<script>
// LOGIN CHECK
if (!localStorage.getItem("loggedInUser")) {
    window.location = "index.html";
}

function logout() {
    localStorage.removeItem("loggedInUser");
    window.location = "index.html";
}
</script>

</body>
</html>
